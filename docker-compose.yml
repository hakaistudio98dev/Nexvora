# Nexvora — stack development/staging. Jalankan: cp .env.example .env && docker compose up --build
name: nexvora

x-api-env: &api-env
  ENV: ${ENV:-development}
  DATABASE_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  JWT_SECRET: ${JWT_SECRET}
  RESERVATION_TTL_MINUTES: ${RESERVATION_TTL_MINUTES:-60}
  PACK_WEIGHT_TOLERANCE_PCT: ${PACK_WEIGHT_TOLERANCE_PCT:-10}
  PUBLIC_APP_URL: ${PUBLIC_ORIGIN}
  SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
  TRIAL_DAYS: ${TRIAL_DAYS:-14}
  GRACE_DAYS: ${GRACE_DAYS:-7}
  BILLING_PROVIDER: ${BILLING_PROVIDER:-manual}
  BANK_TRANSFER_INFO: ${BANK_TRANSFER_INFO:-Transfer ke rekening perusahaan yang tertera di invoice.}
  MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
  MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
  SIMULATOR_STEP_SECONDS: ${SIMULATOR_STEP_SECONDS:-60}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-Nexvora <no-reply@nexvora.local>}
  # ---- Skala (Fase 6)
  ASSISTANT_ENGINE: ${ASSISTANT_ENGINE:-auto}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-sonnet-4-5}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  EVENT_BUS: ${EVENT_BUS:-db}
  DATABASE_READ_URL: ${DATABASE_READ_URL:-}
  STATEMENT_TIMEOUT_MS: ${STATEMENT_TIMEOUT_MS:-15000}
  CORS_ORIGINS: '["${PUBLIC_ORIGIN}"]'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_OWNER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    ports:
      - "127.0.0.1:5432:5432"   # hanya dari mesin lokal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redisdata:/data]

  migrate:
    build: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_MIGRATION_URL: postgresql+psycopg://${POSTGRES_OWNER_USER}:${POSTGRES_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: ./apps/api
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      retries: 10
    # Sengaja TIDAK di-expose ke host: hanya web (BFF) yang memanggil API.

  worker:
    # Perawatan berkala: lepas reservasi kedaluwarsa, tarik status kurir, deteksi event notifikasi,
    # jalankan siklus langganan. Aman dijalankan lebih dari satu replika (dilindungi advisory lock).
    build: ./apps/api
    restart: unless-stopped
    command: ["python", "-m", "app.workers.maintenance"]
    environment:
      <<: *api-env
      WORKER_JOBS: maintenance,ai
    depends_on:
      migrate: { condition: service_completed_successfully }

  dispatcher:
    # Kirim event dari outbox (webhook integrasi & notifikasi) — dipisah agar antrean event
    # tidak tertahan pekerjaan perawatan yang berat, dan bisa di-scale sendiri.
    build: ./apps/api
    restart: unless-stopped
    command: ["python", "-m", "app.workers.maintenance"]
    environment:
      <<: *api-env
      WORKER_JOBS: dispatcher
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      # auto = Secure mengikuti protokol pengunjung (https). Set false bila diakses lewat http di jaringan lokal.
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
    depends_on:
      api: { condition: service_healthy }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web]

  prometheus:
    # Opsional: docker compose --profile observability up -d
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["9090:9090"]
    depends_on: [api]

volumes:
  prometheus_data:
  pgdata:
  redisdata:

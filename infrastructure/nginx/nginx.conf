# Reverse proxy di depan web (Next.js BFF). Di production pasang TLS (listen 443 ssl)
# dan redirect port 80 ke HTTPS. API FastAPI tidak diekspos langsung.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=signup:10m rate=5r/m;

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 2m;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;           # menimpa header palsu dari klien
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;

  # API untuk integrasi mesin (X-API-Key) & webhook payment gateway → langsung ke FastAPI.
  # Browser tetap memakai /api/v1 lewat web (BFF, cookie httpOnly).
  location /ext/api/v1/ {
    limit_req zone=general burst=40 nodelay;
    proxy_pass http://api:8000/api/v1/;
  }

  location = /api/auth/login {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://web:3000;
  }

  location = /api/v1/public/signup {
    limit_req zone=signup burst=3 nodelay;
    proxy_pass http://web:3000;
  }

  location / {
    limit_req zone=general burst=40 nodelay;
    proxy_pass http://web:3000;
  }
}

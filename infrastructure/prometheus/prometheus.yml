# Konfigurasi minimal: ambil metrik API Nexvora tiap 15 detik.
# Jalankan dengan: docker compose --profile observability up -d
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: nexvora-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
    # Bila METRICS_TOKEN diisi di .env, buka komentar baris berikut dan samakan nilainya:
    # authorization:
    #   type: Bearer
    #   credentials: "ISI_METRICS_TOKEN"
